<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>세종 지도 보기</title>
    <meta name="description" content="VWorld 국내 지도를 2D와 3D로 보는 지도 뷰어." />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="세종 지도" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="panel">
      <header class="panel__header">
        <h1>2D 지도</h1>
        <p class="panel__sub">VWorld 국내 지도</p>
      </header>

      <nav class="viewtabs">
        <a class="viewtabs__tab viewtabs__tab--on" href="./" aria-current="page">2D 보기</a>
        <a class="viewtabs__tab" id="to-3d" href="3d.html">3D 보기</a>
      </nav>

      <section class="locate">
        <label class="locate__label" for="address">위치</label>
        <input
          id="address"
          type="search"
          placeholder="주소 또는 '위도, 경도'"
          value="세종특별자치시 연동면 명학산단로 110-5"
          autocomplete="off"
        />
        <div class="locate__row">
          <button id="locate" type="button">이동</button>
        </div>
        <p id="locate-result" class="locate__result"></p>
      </section>

      <section class="locate">
        <label class="locate__label" for="layer2d">배경</label>
        <select id="layer2d">
          <option value="base">일반 지도</option>
          <option value="satellite">위성 영상</option>
          <option value="hybrid">위성 + 지명</option>
          <option value="gray">회색 지도</option>
          <option value="midnight">야간 지도</option>
        </select>
      </section>

      <section class="locate">
        <label class="locate__label">겹쳐 보기</label>
        <label class="check"><input id="parcels2d" type="checkbox" /> 필지 · 공시지가</label>
        <label class="check"><input id="zoning2d" type="checkbox" /> 용도지역</label>
      </section>

      <p id="legend2d" class="legend" hidden></p>

      <p class="status" id="status"></p>

      <footer class="panel__footer">
        <p>배경지도 출처: 국토교통부 VWorld</p>
        <p id="meta" class="meta"></p>
      </footer>
    </aside>

    <main id="map" class="map"></main>

    <p id="map-notice" class="map-notice" hidden></p>

    <script src="data/signs.js" onerror="void 0"></script>
    <script src="vendor/leaflet/leaflet.js"></script>
    <script src="vworld-data.js"></script>
    <script src="view2d.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
