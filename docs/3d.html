<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>3D 지도 — 세종 지도 보기</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      /*
        공용 style.css 가 body 를 flex 로 잡아 둔다. 그 안에서 이 그리드는
        내용 너비만큼만 잡혀 지도 칸(1fr)이 0이 된다. 폭을 명시해야 한다.
      */
      .three-d {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr);
        width: 100%;
        flex: 1 1 auto;
        min-width: 0;
        height: 100vh;
      }
      #vmap {
        width: 100%;
        height: 100%;
        background: #0b1220;
      }
      .three-d__panel {
        overflow-y: auto;
        border-right: 1px solid var(--line);
        background: var(--panel);
        padding: 16px;
      }
      .three-d__panel h1 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .three-d__sub {
        margin: 0 0 16px;
        font-size: 12px;
        color: var(--muted);
      }
      .three-d__field {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }
      .three-d__field label {
        font-size: 11.5px;
        font-weight: 600;
        color: var(--muted);
      }
      .three-d__field input,
      .three-d__field select {
        padding: 8px 10px;
        font-size: 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
      }
      .three-d__check label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .three-d__check input {
        margin: 0;
      }
      .three-d__check {
        gap: 8px;
      }

      .three-d__actions {
        display: flex;
        gap: 6px;
        margin-bottom: 14px;
      }
      .three-d__actions button {
        flex: 1;
        padding: 9px 12px;
        font-size: 12.5px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      .three-d__actions a {
        flex: 1;
        padding: 9px 12px;
        font-size: 12.5px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        color: inherit;
        text-decoration: none;
        text-align: center;
      }
      .poi-label {
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.94);
        color: #0f172a;
        font-size: 11.5px;
        font-weight: 600;
        line-height: 1.2;
        white-space: nowrap;
        border: 1px solid rgba(15, 23, 42, 0.12);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        pointer-events: none;
        transform: translateY(-6px);
      }

      .three-d__panel .viewtabs {
        padding: 0 0 14px;
      }

      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin: 0 0 12px;
        font-size: 11.5px;
        color: var(--muted);
      }
      .legend__item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      .legend__item i {
        width: 11px;
        height: 11px;
        border-radius: 3px;
        display: inline-block;
      }

      #status3d {
        margin: 0 0 12px;
        padding: 10px 12px;
        border-radius: 8px;
        border-left: 4px solid var(--other);
        background: var(--bg);
        font-size: 12px;
        line-height: 1.55;
        white-space: pre-wrap;
      }
      #status3d[data-tone='ok'] {
        border-left-color: var(--allowed);
      }
      #status3d[data-tone='error'] {
        border-left-color: var(--nostop);
      }
      #diag {
        margin: 0;
        font-size: 11px;
        line-height: 1.6;
        color: var(--muted);
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        word-break: break-all;
      }
      @media (max-width: 800px) {
        .three-d {
          grid-template-columns: 1fr;
          grid-template-rows: auto 1fr;
        }
        .three-d__panel {
          border-right: 0;
          border-bottom: 1px solid var(--line);
          max-height: 45vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="three-d">
      <aside class="three-d__panel">
        <h1>3D 지도</h1>
        <p class="three-d__sub">VWorld 지도를 기울여 보고, 건물을 입체로 세웁니다.</p>

        <nav class="viewtabs">
          <a class="viewtabs__tab" id="to-2d" href="./">2D 보기</a>
          <a class="viewtabs__tab viewtabs__tab--on" href="3d.html" aria-current="page">3D 보기</a>
        </nav>

        <p id="status3d">준비 중…</p>

        <div class="three-d__field">
          <label for="place">위치</label>
          <input id="place" type="search" value="세종특별자치시 연동면 명학산단로 110-5" autocomplete="off" />
        </div>

        <div class="three-d__field">
          <label for="tilt">시점</label>
          <select id="tilt">
            <option value="-90">수직 내려보기</option>
            <option value="-45" selected>비스듬히 (45°)</option>
            <option value="-20">낮게 (20°)</option>
          </select>
        </div>

        <div class="three-d__field">
          <label for="layer">배경</label>
          <select id="layer">
            <option value="base">일반 지도</option>
            <option value="satellite">위성 영상</option>
            <option value="hybrid">위성 + 지명</option>
            <option value="gray">회색 지도</option>
            <option value="midnight">야간 지도</option>
          </select>
        </div>

        <div class="three-d__field">
          <label for="source">건물 데이터</label>
          <select id="source">
            <option value="auto">국가 데이터 우선 (전국·층수 정확)</option>
            <option value="osm">OpenStreetMap (사진과 잘 맞음)</option>
          </select>
        </div>

        <div class="three-d__field three-d__check">
          <label><input id="buildings" type="checkbox" checked /> 건물 3D로 세우기</label>
          <label><input id="labels" type="checkbox" checked /> 상호·건물명 표시</label>
          <label><input id="zoning" type="checkbox" /> 용도지역 색으로 구분</label>
        </div>

        <p id="legend" class="legend" hidden></p>

        <div class="three-d__actions">
          <button id="go" type="button">이동</button>
        </div>

        <p id="diag"></p>
      </aside>

      <main id="vmap"></main>
    </div>

    <script src="data/signs.js" onerror="void 0"></script>
    <script src="3d.js"></script>
    <script src="sw-register.js"></script>
  </body>
</html>
