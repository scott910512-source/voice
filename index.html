<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>세종시 주차 허용·금지 구간 지도</title>
    <!--
      GitHub Pages의 Source 폴더를 /docs 가 아니라 / (root) 로 지정하면
      index.html이 없어 README.md가 대신 렌더링된다. 앱 대신 문서가 뜨는
      것인데 원인을 알기 어렵다. 어느 쪽으로 설정하든 앱이 열리도록
      루트에 진입점을 둔다.
    -->
    <meta http-equiv="refresh" content="0; url=./docs/" />
    <link rel="canonical" href="./docs/" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      a {
        color: #2563eb;
      }
    </style>
  </head>
  <body>
    <p>
      지도를 여는 중입니다. 자동으로 넘어가지 않으면
      <a href="./docs/">여기를 눌러 주세요</a>.
    </p>
    <script>
      location.replace('./docs/');
    </script>
  </body>
</html>
