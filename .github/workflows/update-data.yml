name: 공공데이터 갱신 및 Pages 배포

on:
  push:
    branches:
      - claude/sejong-road-sign-api-cuapbl
  schedule:
    # 매일 04:00 UTC (한국시간 13:00)
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  # 새 푸시가 오면 진행 중인 실행을 대체한다. 공공데이터 응답이 멎어
  # 오래 매달리는 경우가 있어, 큐에 쌓아두는 것보다 낫다.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공공데이터 조회 및 정적 앱 빌드
        id: build
        env:
          # 저장소 시크릿이 있으면 그것을 쓰고, 없으면 config.js의 기본 인증키를 쓴다.
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          # 지도 키는 브라우저에 노출되는 클라이언트 키다. 콘솔에서 도메인으로
          # 사용을 제한하는 방식이라 정적 페이지에 들어가도 된다.
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
          KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
          VWORLD_KEY: ${{ vars.VWORLD_KEY }}
        run: |
          for name in SERVICE_KEY NAVER_MAP_CLIENT_ID KAKAO_MAP_JS_KEY VWORLD_KEY; do
            [ -z "${!name}" ] && unset "$name"
          done
          node scripts/build-static.js 2>&1 | tee build.log

      - name: 테스트
        run: npm test

      - name: 갱신 결과 요약
        if: always()
        run: |
          {
            echo '## 공공데이터 조회 결과'
            echo ''
            echo '```'
            cat build.log 2>/dev/null || echo '빌드 로그 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 변경사항 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo '변경 없음'
          else
            git commit -m '데이터 갱신 (자동)'
            git push
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
