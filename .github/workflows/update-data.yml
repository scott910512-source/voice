name: 공공데이터 갱신 및 Pages 배포

on:
  push:
    branches:
      - claude/sejong-road-sign-api-cuapbl
  schedule:
    # 매주 월요일 04:00 UTC (한국시간 13:00).
    # 원본 데이터의 기준일자(crtrYmd)가 2020-01-20이라 자주 돌 이유가 없다.
    # GitHub 러너에서 apis.data.go.kr 로의 접속이 간헐적으로 막히기도 해서,
    # 매일 돌리면 실패 알림만 쌓인다.
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  # 새 푸시가 오면 진행 중인 실행을 대체한다. 공공데이터 응답이 멎어
  # 오래 매달리는 경우가 있어, 큐에 쌓아두는 것보다 낫다.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 공공데이터 조회 및 정적 앱 빌드
        id: build
        env:
          # 저장소 시크릿이 있으면 그것을 쓰고, 없으면 config.js의 기본 인증키를 쓴다.
          SERVICE_KEY: ${{ secrets.SERVICE_KEY }}
          # 지도 키는 브라우저에 노출되는 클라이언트 키다. 콘솔에서 도메인으로
          # 사용을 제한하는 방식이라 정적 페이지에 들어가도 된다.
          NAVER_MAP_CLIENT_ID: ${{ vars.NAVER_MAP_CLIENT_ID }}
          KAKAO_MAP_JS_KEY: ${{ vars.KAKAO_MAP_JS_KEY }}
          VWORLD_KEY: ${{ vars.VWORLD_KEY }}
        run: |
          # tee를 거치면 종료 코드가 tee의 것이 되어 빌드 실패가 성공으로 넘어간다.
          set -o pipefail
          for name in SERVICE_KEY NAVER_MAP_CLIENT_ID KAKAO_MAP_JS_KEY VWORLD_KEY; do
            [ -z "${!name}" ] && unset "$name"
          done
          node scripts/build-static.js 2>&1 | tee build.log

      - name: 지도 인증키 확인
        if: always()
        env:
          VWORLD_KEY: ${{ vars.VWORLD_KEY }}
        run: |
          [ -z "$VWORLD_KEY" ] && unset VWORLD_KEY
          node scripts/check-map-key.js "세종특별자치시 연동면 명학산단로 110-5" 2>&1 | tee mapkey.log

      - name: 테스트
        run: npm test

      - name: 갱신 결과 요약
        if: always()
        run: |
          {
            echo '## 공공데이터 조회 결과'
            echo ''
            echo '```'
            cat build.log 2>/dev/null || echo '빌드 로그 없음'
            echo '```'
            echo ''
            echo '## 지도 인증키 확인'
            echo ''
            echo '```'
            cat mapkey.log 2>/dev/null || echo '확인 로그 없음'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 변경사항 커밋
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --staged --quiet; then
            echo '변경 없음'
            exit 0
          fi
          git commit -m '데이터 갱신 (자동)'

          # 실행 중에 브랜치가 앞서 나가면 push가 거절된다. 재실행할 때 특히 잦다.
          # docs/ 는 생성물이므로 충돌하면 방금 만든 쪽을 남긴다.
          # rebase 중에는 theirs가 '지금 얹는 커밋'이라 our 생성물을 가리킨다.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "푸시 성공 (${attempt}회차)"
              exit 0
            fi
            echo "푸시 거절됨. 원격을 가져와 다시 시도합니다 (${attempt}회차)"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME" || git rebase --abort || true
            sleep 5
          done
          echo '::error::데이터 갱신 커밋을 푸시하지 못했습니다.'
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
